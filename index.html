<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OST Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a1a2e;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 48px 20px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #e2e8f0;
    }

    header p {
      margin-top: 8px;
      color: #718096;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .section {
      max-width: 880px;
      margin: 0 auto 40px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 14px;
      padding-left: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .card {
      background: #16213e;
      border-radius: 14px;
      padding: 24px 16px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 1px solid #0f3460;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
      border-color: #e94560;
    }

    .card .icon {
      font-size: 32px;
      line-height: 1;
    }

    .card .name {
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .card .desc {
      font-size: 11px;
      color: #718096;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>OST Tool</h1>
    <p>工具清單</p>
  </header>

  <div class="section">
    <div class="section-title">一般工具</div>
    <div class="grid">
      <a class="card" href="./calculator/">
        <div class="icon">🧮</div>
        <div class="name">計算機</div>
        <div class="desc">基本四則運算</div>
      </a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">金流 / Payment</div>
    <div class="grid">
      <a class="card" href="./payment-api/gomoney-withdraw-tester.html">
        <div class="icon">💳</div>
        <div class="name">GoMoney 提款測試</div>
        <div class="desc">出款 API 測試工具</div>
      </a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Admin / 後台</div>
    <div class="grid">
      <a class="card" href="./gg-admin-api-tester/">
        <div class="icon">🔧</div>
        <div class="name">GG Admin API Tester</div>
        <div class="desc">Admin Backend API 測試工具</div>
      </a>
    </div>
  </div>
</body>
</html>
